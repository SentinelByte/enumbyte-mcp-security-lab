name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start servers
        run: docker compose up -d

      - name: Wait for servers to be ready
        run: |
          for i in {1..10}; do
            curl -sf -X POST http://localhost:8000/tools/call \
              -H "Content-Type: application/json" \
              -d '{"tool":"echo","arguments":{"content":"ping"}}' && break
            sleep 2
          done

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: pytest tests/ -v
